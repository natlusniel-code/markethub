<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>MarketHub — Shop electronics, fashion, home &amp; more</title>
    <meta
      name="description"
      content="MarketHub is Nigeria's everyday marketplace — electronics, fashion, home and kitchen, phones, beauty, groceries, fitness, computers and baby products, delivered nationwide."
    />
    <meta name="theme-color" content="#4F2DD6" />

    <!-- ── Icons: generated from the MarketHub mark (scripts/make-icons.py) ── -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icon-16.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/logo-mark.svg" color="#4F2DD6" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- ── Social / Open Graph ── -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MarketHub" />
    <meta property="og:title" content="MarketHub — Shop electronics, fashion, home &amp; more" />
    <meta
      property="og:description"
      content="Everyday essentials and the good stuff, at prices that make sense. Delivered across Nigeria."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MarketHub" />
    <meta name="twitter:image" content="/og-image.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
